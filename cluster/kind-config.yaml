kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: dasaco

nodes:
  - role: control-plane

networking:
  ipFamily: ipv4
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        service-node-port-range: "30000-32767"
